[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hp1800ctl"
version = "0.3.7"
description = "Experimental management client for HP ProCurve 1800-24G switches"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "UNLICENSED - all rights reserved" }
dependencies = [
  "requests>=2.31,<3",
  "PyYAML>=6,<7",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Networking",
]

[project.scripts]
hp1800ctl = "hp1800ctl:main"

[tool.setuptools]
py-modules = ["hp1800ctl"]
